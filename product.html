<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Dashboard</title>
    <link rel="stylesheet" href="public/style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script> <!-- Add FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</head>

<body class="bg-gray-100">

    <div class="flex">

        <!-- Left Sidebar -->
        <div id="left" class="w-[15%] bg-gray-200 p-4 shadow-md min-h-screen flex flex-col">
            <div class="text-2xl font-bold mb-4 border-b-2 border-gray-400 w-full">Auction 1</div>
            <ul class="space-y-2 flex-grow">
                <li>
                    <a id="dashboardLink" href="dasboard.html" class="text-black block px-4 py-2 rounded-lg">
                        <i class="fas fa-home" aria-hidden="true"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a id="productLink" href="product.html" class="text-black block px-4 py-2 rounded-lg">
                        <i class="fas fa-copy" aria-hidden="true"></i> Products
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Container -->
        <div id="right" class="w-[85%] px-4 w-full bg-gray-200">
            <div class="m-2 p-4 bg-white border border-gray-300 rounded-lg min-h-screen">
                <!-- Use min-h-screen instead -->
                <!-- Title, Search Bar, Sort, Filter, and Add Button in the same line -->
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-3xl font-semibold">Products</h1>

                    <input id="searchInput" type="text" placeholder="Search by name, product category"
                        class="mx-auto w-1/3 px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
                    <!-- Centered search bar -->

                    <button id="addProductBtn"
                        class="bg-amber-500 text-black px-4 py-2 rounded-lg hover:bg-amber-400 text-nowrap">
                        Add Product
                    </button>
                </div>

                <!-- Product Table -->
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white rounded-lg shadow-lg">
                        <thead>
                            <tr class="text-gray-400 text-left text-sm border-b"> <!-- Only row border -->
                                <th class="w-[10%] py-3 px-4 cursor-pointer" data-sort="id">
                                    <!-- Reduced width for ID column -->
                                    ID <i id="idSortIcon" class="fas fa-sort"></i> <!-- Sort icon for ID -->
                                </th>
                                <th class="w-[50%] py-3 px-4">Product Name</th>
                                <!-- Increased width for Product Name -->
                                <th class="w-[15%] py-3 px-4 cursor-pointer" data-sort="price">
                                    Price <i id="priceSortIcon" class="fas fa-sort"></i> <!-- Sort icon for Price -->
                                </th>
                                <th class="w-[15%] py-3 px-4">Category</th>
                                <th class="w-[10%] py-3 px-4">Order</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody" class="divide-y"> <!-- Only row borders in tbody -->
                            <!-- Product rows will be injected here by JavaScript -->
                        </tbody>
                    </table>

                </div>

                <!-- Pagination Controls -->
                <div class="flex justify-end items-center mt-4">
                    <div class="mr-4">
                        <label for="resultsPerPage" class="mr-2">Results per page:</label>
                        <select id="resultsPerPage" class="px-2 py-1 border rounded-lg">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>

                    <div id="paginationInfo" class="text-gray-700 mr-4">
                        <!-- Display current range here, e.g., "1-10 of 20" -->
                    </div>

                    <div>
                        <button id="prevPage" class="text-2xl px-3 py-1 rounded-l mr-2">&lt;</button>
                        <button id="nextPage" class="text-2xl px-3 py-1 rounded-r">&gt;</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h2 id="modalTitle" class="text-xl font-semibold mb-4">Add Product</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="mb-4">
                    <label for="productName" class="block text-sm font-medium">Product Name</label>
                    <input type="text" id="productName" class="w-full border px-4 py-2 rounded" required>
                </div>
                <div class="mb-4">
                    <label for="productPrice" class="block text-sm font-medium">Product Price</label>
                    <input type="number" id="productPrice" class="w-full border px-4 py-2 rounded" step="0.01" required>
                </div>
                <div class="mb-4">
                    <label for="productCategory" class="block text-sm font-medium">Product Category</label>
                    <input type="text" id="productCategory" class="w-full border px-4 py-2 rounded" required>
                </div>
                <div class="mb-4">
                    <label for="productOrder" class="block text-sm font-medium">Order</label>
                    <input type="number" id="productOrder" class="w-full border px-4 py-2 rounded" required>
                </div>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Save Product
                </button>
                <button type="button" id="closeModal" class="ml-4 bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">
                    Cancel
                </button>
            </form>
        </div>
    </div>
    <!-- JavaScript -->
    <script>
        // Initial Variables
        let products = [];
        const productTableBody = document.getElementById('productTableBody');
        const productModal = document.getElementById('productModal');
        const productForm = document.getElementById('productForm');
        const modalTitle = document.getElementById('modalTitle');
        const productIdInput = document.getElementById('productId');
        const productNameInput = document.getElementById('productName');
        const productPriceInput = document.getElementById('productPrice');
        const productCategoryInput = document.getElementById('productCategory');
        const productOrderInput = document.getElementById('productOrder');
        const addProductBtn = document.getElementById('addProductBtn');
        const closeModal = document.getElementById('closeModal');
        const searchInput = document.getElementById('searchInput');
        const prevPage = document.getElementById('prevPage');
        const nextPage = document.getElementById('nextPage');
        const idSortIcon = document.getElementById('idSortIcon');
        const priceSortIcon = document.getElementById('priceSortIcon');
        const resultsPerPageSelect = document.getElementById('resultsPerPage');
        const paginationInfo = document.getElementById('paginationInfo');
        let sortDirection = { id: 'asc', price: 'asc' }; // Sorting direction

        let currentPage = 1;
        let productsPerPage = 10;

        // Fetch Products from API
        async function fetchProducts() {
            try {
                // showSkeletonLoading();
                productTableBody.innerHTML = ('<tr>' + '<td class="border-b px-4 py-2"><div class="h-4 bg-gray-200 rounded animate-pulse"></div></td>'.repeat(5) + '</tr>').repeat(10);
                setTimeout(async () => {
                    const response = await fetch('https://fakestoreapi.com/products');
                    products = await response.json();
                    displayProducts(products);
                }, 2000);
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }

        // // Show 10 Skeleton Loading Rows
        // function showSkeletonLoading() {
        //     productTableBody.innerHTML = ''; // Clear existing rows

        //     for (let i = 0; i < 10; i++) {
        //         const row = document.createElement('tr');
        //         row.innerHTML = Array(5).fill(`
        //     <td class="border-b px-4 py-2">
        //         <div class="h-4 bg-gray-200 rounded animate-pulse"></div>
        //     </td>
        // `).join(''); // Create 5 cells for each row
        //         productTableBody.appendChild(row);
        //     }
        // }


        // Display Products with Correct Pagination Calculation
        function displayProducts(productArray) {
            productTableBody.innerHTML = '';

            // Recalculate the start and end indices based on the current page and selected products per page
            const start = (currentPage - 1) * productsPerPage;
            // const start = Math.min((currentPage - 1) * productsPerPage, products.length);

            const end = Math.min(start + productsPerPage, productArray.length); // Ensure 'end' is within bounds

            const paginatedProducts = productArray.slice(start, end); // Get products for current page

            // Render the products for the current page
            paginatedProducts.forEach((product) => {
                const row = document.createElement('tr');
                row.setAttribute('data-id', product.id);
                row.innerHTML = `
                    <td class="border-b px-4 py-2">${product.id}</td>
                    <td class="border-b px-4 py-2">${product.title}</td>
                    <td class="border-b px-4 py-2">$${product.price}</td>
                    <td class="border-b px-4 py-2">${product.category}</td>
                    <td class="border-b px-4 py-2">${product.id}</td>
                `;

                // Add a click event listener to each row
                row.addEventListener('click', () => {
                    const productId = parseInt(row.dataset.id);
                    const productToEdit = productArray.find(product => product.id === productId);

                    if (productToEdit) {
                        modalTitle.textContent = 'Edit Product';
                        productIdInput.value = productToEdit.id;
                        productNameInput.value = productToEdit.title;
                        productPriceInput.value = productToEdit.price;
                        productCategoryInput.value = productToEdit.category;
                        productOrderInput.value = productToEdit.order || 1;

                        productModal.classList.remove('hidden');
                    }
                });

                productTableBody.appendChild(row);
            });

            updatePaginationInfo(productArray.length); // Update pagination info
            // Update "Next" button state
            nextPage.disabled = end >= productArray.length; // Disable "Next" if on the last page

        }

        // Create New Product
        async function createProduct(newProduct) {
            try {
                const response = await fetch('https://fakestoreapi.com/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newProduct)
                });
                const createdProduct = await response.json();
                products.push(createdProduct);
                displayProducts(products);
            } catch (error) {
                console.error('Error creating product:', error);
            }
        }

        // Update Existing Product
        async function updateProduct(updatedProduct) {
            try {
                await fetch(`https://fakestoreapi.com/products/${updatedProduct.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedProduct)
                });
                const index = products.findIndex(product => product.id === updatedProduct.id);
                products[index] = updatedProduct;
                displayProducts(products);
            } catch (error) {
                console.error('Error updating product:', error);
            }
        }

        // Delete Product
        async function deleteProduct(productId) {
            try {
                await fetch(`https://fakestoreapi.com/products/${productId}`, {
                    method: 'DELETE'
                });
                products = products.filter(product => product.id !== productId);
                displayProducts(products);
            } catch (error) {
                console.error('Error deleting product:', error);
            }
        }


        // Search Products
        searchInput.addEventListener('input', () => {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredProducts = products.filter(product =>
                product.title.toLowerCase().includes(searchTerm) || // Corrected from product.name to product.title
                product.category.toLowerCase().includes(searchTerm)
            );
            displayProducts(filteredProducts);
        });

        // Add Product
        addProductBtn.addEventListener('click', () => {
            modalTitle.textContent = 'Add Product';
            productForm.reset();
            productModal.classList.remove('hidden');
            productIdInput.value = ''; // Clear productId for adding a new product
        });

        // Close Modal
        closeModal.addEventListener('click', () => {
            productModal.classList.add('hidden');
        });

        // Save Product (Create or Update)
        productForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const id = productIdInput.value ? parseInt(productIdInput.value) : null;
            const name = productNameInput.value;
            const price = parseFloat(productPriceInput.value);
            const category = productCategoryInput.value;
            const order = parseInt(productOrderInput.value);

            const product = { title: name, price, category, order };

            if (id) {
                product.id = id;
                updateProduct(product);
            } else {
                createProduct(product);
            }

            productModal.classList.add('hidden'); // Close modal
            productForm.reset(); // Reset form fields
        });

        // Delete Product
        productTableBody.addEventListener('click', (event) => {
            if (event.target.classList.contains('deleteProductBtn')) {
                const productId = parseInt(event.target.dataset.id);
                // products = products.filter(product => product.id !== productId);
                displayProducts(products);
            }
        });

        // Save Product
        productForm.addEventListener('submit', (event) => {
            event.preventDefault(); // Prevent form submission

            const id = productIdInput.value ? parseInt(productIdInput.value) : null;
            const name = productNameInput.value;
            const price = parseFloat(productPriceInput.value);
            const category = productCategoryInput.value;
            const order = parseInt(productOrderInput.value);

            if (id) {
                // Edit existing product
                const index = products.findIndex(product => product.id === id);
                products[index] = { id, name, price, category, order };
            } else {
                // Add new product
                const newProduct = { id: products.length + 1, name, price, category, order };
                products.push(newProduct);
            }

            displayProducts(products);
            productModal.classList.add('hidden'); // Close modal
            productForm.reset(); // Reset form fields
        });

        function sortProducts(column) {
            const direction = sortDirection[column];
            products.sort((a, b) => {
                if (direction === 'asc') {
                    return a[column] > b[column] ? 1 : -1;
                } else {
                    return a[column] < b[column] ? 1 : -1;
                }
            });

            // Toggle sorting direction and update icons
            sortDirection[column] = direction === 'asc' ? 'desc' : 'asc';
            updateSortIcons(column, sortDirection[column]);

            displayProducts(products);
        }

        // Event listeners for sortable columns (ID and Price)
        document.querySelector('[data-sort="id"]').addEventListener('click', () => sortProducts('id'));
        document.querySelector('[data-sort="price"]').addEventListener('click', () => sortProducts('price'));

        function updateSortIcons(column, direction) {
            if (column === 'id') {
                idSortIcon.className = direction === 'asc' ? 'fas fa-sort-down' : 'fas fa-sort-up';
                priceSortIcon.className = 'fas fa-sort'; // Reset Price icon
            } else if (column === 'price') {
                priceSortIcon.className = direction === 'asc' ? 'fas fa-sort-down' : 'fas fa-sort-up';
                idSortIcon.className = 'fas fa-sort'; // Reset ID icon
            }
        }

        // Update Pagination Information (e.g., "1-10 of 20")
        function updatePaginationInfo(totalProducts) {
            const start = (currentPage - 1) * productsPerPage + 1;
            // const start = Math.min((currentPage - 1) * productsPerPage, products.length);
            const end = Math.min(currentPage * productsPerPage, totalProducts);
            paginationInfo.textContent = `${start}-${end} of ${totalProducts}`;
        }

        // Change the number of products per page
        resultsPerPageSelect.addEventListener('change', () => {
            productsPerPage = parseInt(resultsPerPageSelect.value);
            currentPage = 1; // Reset to first page
            displayProducts(products);
        });

        // Pagination Controls (Next and Previous buttons)
        prevPage.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                displayProducts(products);
            }
        });

        nextPage.addEventListener('click', () => {
            const totalPages = Math.ceil(products.length / productsPerPage); // Total number of pages
            if (currentPage < totalPages) {
                currentPage++;
                displayProducts(products);
            }
        });

        // JavaScript to highlight the active link
        document.addEventListener('DOMContentLoaded', () => {
            const currentLocation = window.location.href; // Get the current URL
            const dashboardLink = document.getElementById('dashboardLink');
            const productLink = document.getElementById('productLink');

            // Check if the current URL contains "dasboard.html" (for Dashboard)
            if (currentLocation.includes('dasboard.html')) {
                dashboardLink.classList.add('bg-gradient-to-r', 'from-amber-500', 'to-gray-200');
                dashboardLink.classList.add('text-black'); // Optional: Change text color for active link
            }

            // Check if the current URL contains "product.html" (for Products)
            if (currentLocation.includes('product.html')) {
                productLink.classList.add('bg-gradient-to-r', 'from-amber-500', 'to-gray-200');
                productLink.classList.add('text-black'); // Optional: Change text color for active link
            }
        });


        // Initial Fetch of Products
        fetchProducts();
    </script>

</body>

</html>
